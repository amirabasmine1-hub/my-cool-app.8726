<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اخبار | Amir Gamer</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="panel.css">

<style>
.news-container{
max-width:1100px;
margin:100px auto 40px;
padding:20px;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
}

.news-card{
background:#101827;
border:1px solid #1f2937;
border-radius:18px;
overflow:hidden;
transition:.3s;
cursor:pointer;
}

.news-card:hover{
transform:translateY(-8px);
box-shadow:0 0 25px rgba(0,255,255,.25);
}

.news-card img{
width:100%;
height:210px;
object-fit:cover;
}

.news-content{
padding:18px;
}

.news-content h3{
margin-bottom:10px;
color:#00d9ff;
}

.news-content p{
opacity:.8;
line-height:1.8;
}
</style>

</head>
<body>

<header>
<div class="logo">🎮 Amir Gamer</div>

<nav>
<a href="index.html">خانه</a>
<a href="news.html">اخبار</a>
<a href="panel.html">پنل</a>
</nav>

</header>

<div class="news-container">

<h1>📰 آخرین اخبار</h1>

<br><br>
<div class="search-box">

<input
type="text"
id="searchNews"
placeholder="🔍 جستجوی خبر...">

</div>
<div id="newsList" class="news-grid"></div>

</div>
<script>
const newsList = document.getElementById("newsList");

const news = JSON.parse(localStorage.getItem("news")) || [];

if(news.length === 0){

newsList.innerHTML = `
<div class="news-card">
<div class="news-content">
<h3>هنوز خبری منتشر نشده است.</h3>
<p>اولین خبر را از پنل مدیریت ثبت کنید.</p>
</div>
</div>
`;

}else{

news.forEach(item=>{

newsList.innerHTML += `
<div class="news-card">
<div class="news-content">
<h3>${item.title}</h3>
<p>${item.text}</p>
</div>
</div>
`;

});

}
</script>
<script>
async function loadNews(){

const response = await fetch("news.json");

const news = await response.json();

const newsList = document.getElementById("newsList");

newsList.innerHTML="";

news.forEach(item=>{

newsList.innerHTML+=`
<div class="news-card">

<div class="news-content">

<h3>${item.title}</h3>

<p>${item.text}</p>

</div>

</div>
`;

});

}

loadNews();
</script>

</body>
</html>
