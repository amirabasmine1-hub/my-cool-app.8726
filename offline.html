<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>آفلاین</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #111827, #030712);
      color:#fff;
      overflow:hidden;
    }
    .box{
      width: min(560px, 92vw);
      padding: 22px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      text-align:center;
    }
    .icon{
      width: 68px; height: 68px;
      border-radius: 18px;
      margin: 0 auto 12px;
      display:flex; align-items:center; justify-content:center;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      font-size: 30px;
    }
    .title{
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .desc{
      opacity:.9;
      line-height: 1.8;
      margin-bottom: 16px;
      font-size: 14.5px;
    }
    .btn{
      appearance:none;
      border:0;
      cursor:pointer;
      background: linear-gradient(90deg, #0ea5e9, #6366f1);
      color:#fff;
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 12px;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      display:block;
      transition: transform .15s ease;
    }
    .btn:active{ transform: scale(.98); }

    /* به‌روزسازی متن وضعیت */
    #status{
      margin-top: 10px;
      font-size: 13px;
      opacity:.85;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <div class="title">اینترنتت قطعه</div>
    <div class="desc">
      لطفاً اتصال اینترنت را بررسی کن. پس از وصل شدن، صفحه به‌صورت خودکار برمی‌گرده.
    </div>

    <button class="btn" onclick="location.reload()">تلاش مجدد</button>
    <div id="status">وضعیت: در حال چک کردن...</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');

    function setStatus(isOnline){
      statusEl.textContent = isOnline
        ? 'وضعیت: آنلاین ✅ در حال بازگشت...'
        : 'وضعیت: آفلاین ❌';
    }

    function check(){
      const isOnline = navigator.onLine;
      setStatus(isOnline);

      // اگر آنلاین شد، برگرد به صفحه اصلی
      if(isOnline){
        // اینجا مسیر صفحه اصلی را با ساختار سایتت هماهنگ کن:
        // مثلاً اگر اصلی شما index.html است:
        window.location.href = './index.html';
      }
    }

    window.addEventListener('online', () => check());
    window.addEventListener('offline', () => check());

    // چک اولیه
    check();
  </script>
</body>
</html>
